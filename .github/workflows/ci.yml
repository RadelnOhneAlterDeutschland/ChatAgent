name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Test-only values. Real secrets come from AWS Secrets Manager at deploy time.
  DATABASE_URL: sqlite+pysqlite:///:memory:
  JWT_SECRET: ci-secret-not-used-in-production
  OPENAI_API_KEY: ci-openai-key
  PINECONE_API_KEY: ci-pinecone-key
  PINECONE_INDEX_NAME: ci-index
  S3_BUCKET_NAME: ci-bucket

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — pushing to ECR and deploying ECS lands in Phase 6.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

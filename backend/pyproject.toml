[project]
name = "chatagent-backend"
version = "0.1.0"
description = "Multi-model PDF/DB chat agent — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "boto3>=1.34",
    "pinecone>=5.0",
    "openai>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-bdd>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: touches a real external service (DB, S3, Pinecone, OpenAI)",
]
bdd_features_base_dir = "tests/features"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
